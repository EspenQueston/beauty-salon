[project]
name = "salon-api"
version = "0.1.0"
description = "Beauty Salon SaaS - API multi-tenant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
    "django-cors-headers>=4.6",
    "django-redis>=5.4",
    "celery[redis]>=5.4",
    "pillow>=11.0",
    "sentry-sdk[django]>=2.20",
    "django-otp>=1.7.3",
    "qrcode>=8.2",
    "openpyxl>=3.1.5",
    "pywebpush>=2.5.0",
    # Traduction du contenu des salons. Sans cle, le paquet n est jamais
    # importe : voir apps/translations/traducteur.py.
    "openai>=1.60",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--reuse-db"
