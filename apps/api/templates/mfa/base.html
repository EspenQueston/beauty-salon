{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sécurité{% endblock %} · Beauty Salon</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; padding: 2.5rem 1rem; background: #faf7f8; color: #18181b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5;
    }
    .carte {
      max-width: 34rem; margin: 0 auto; background: #fff; padding: 2rem;
      border: 1px solid #e4e4e7; border-radius: 0.75rem;
    }
    h1 { margin-top: 0; font-size: 1.35rem; }
    p { color: #3f3f46; }
    .discret { color: #71717a; font-size: 0.9rem; }
    .qr { display: flex; justify-content: center; margin: 1.5rem 0; }
    .qr svg { width: 200px; height: 200px; }
    code {
      display: inline-block; background: #f4f4f5; padding: 0.4rem 0.6rem;
      border-radius: 0.35rem; font-size: 0.95rem; word-break: break-all;
    }
    input[type="text"] {
      width: 100%; padding: 0.6rem 0.75rem; font-size: 1.15rem;
      letter-spacing: 0.2em; border: 1px solid #e4e4e7; border-radius: 0.5rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 1rem; width: 100%; padding: 0.7rem 1rem; border: 0;
      border-radius: 0.5rem; background: #b4436c; color: #fff;
      font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    .erreur {
      background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
      padding: 0.6rem 0.8rem; border-radius: 0.5rem; margin-bottom: 1rem;
    }
    ol.codes { columns: 2; font-family: ui-monospace, monospace; font-size: 1.05rem; }
    ol.codes li { margin-bottom: 0.35rem; }
    a.suite { display: inline-block; margin-top: 1.5rem; color: #b4436c; }
  </style>
</head>
<body>
  <div class="carte">
    {% if messages %}{% for message in messages %}
      <p class="erreur">{{ message }}</p>
    {% endfor %}{% endif %}
    {% block contenu %}{% endblock %}
  </div>
</body>
</html>
