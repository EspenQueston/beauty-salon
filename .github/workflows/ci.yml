name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer les dependances
        run: uv sync --all-groups

      # Les deux roles de l'isolation RLS. En local ce script est joue par
      # l'entrypoint Postgres ; ici il faut l'appliquer nous-memes.
      - name: Creer les roles PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d salon -v ON_ERROR_STOP=1 -f ../../infra/postgres/init/01-roles.sql

      - name: Linter
        run: uv run ruff check .

      - name: Verifier l'absence de migration manquante
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://salon_app:salon_app@localhost:5432/salon
          DATABASE_ADMIN_URL: postgres://salon_admin:salon_admin@localhost:5432/salon
        run: uv run python manage.py makemigrations --check --dry-run

      # Le seuil ne porte que sur les modules ou une regression coute cher :
      # l'isolation tenant et le moteur de reservation.
      - name: Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://salon_app:salon_app@localhost:5432/salon
          DATABASE_ADMIN_URL: postgres://salon_admin:salon_admin@localhost:5432/salon
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
        run: >-
          uv run pytest -q
          --cov=apps/common --cov=apps/scheduling
          --cov-report=term-missing
          --cov-fail-under=85

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Linter
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_PLATFORM_DOMAIN: example.com
          NEXT_PUBLIC_API_URL: https://api.example.com
          INTERNAL_API_URL: http://127.0.0.1:8000
        run: npm run build
